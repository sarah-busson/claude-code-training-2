<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Churn Prevention Strategy - Board Presentation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0f1419;
            color: #e0e0e0;
            overflow: hidden;
        }

        .presentation-container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .slide {
            display: none;
            width: 100%;
            height: 100%;
            padding: 60px;
            background: linear-gradient(135deg, #1a2332 0%, #0f1419 100%);
            overflow-y: auto;
            color: #e0e0e0;
        }

        .slide.active {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .slide-title {
            font-size: 52px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 40px;
            border-bottom: 4px solid #2b6bb8;
            padding-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .slide-subtitle {
            font-size: 28px;
            color: #a8b8d0;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .content {
            flex-grow: 1;
            display: flex;
            gap: 40px;
        }

        .left-column, .right-column {
            flex: 1;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
            margin: 30px 0;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .scqa-box {
            background: rgba(43, 107, 184, 0.1);
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #2b6bb8;
            border-radius: 6px;
            font-size: 16px;
            line-height: 1.7;
            color: #e0e0e0;
        }

        .scqa-box strong {
            color: #6ba3d8;
            font-size: 18px;
        }

        .pyramid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin: 30px 0;
        }

        .pyramid-level {
            background: rgba(100, 120, 150, 0.15);
            border: 2px solid rgba(107, 163, 216, 0.4);
            border-radius: 8px;
            padding: 15px 30px;
            text-align: center;
            width: 100%;
            font-weight: 600;
            font-size: 16px;
            color: #e0e0e0;
        }

        .pyramid-level.critical {
            background: rgba(192, 57, 43, 0.15);
            border-color: #c85845;
            color: #d97a6b;
        }

        .pyramid-level.high {
            background: rgba(155, 89, 182, 0.15);
            border-color: #9b59b6;
            color: #b878d9;
        }

        .financial-box {
            background: rgba(39, 174, 96, 0.12);
            border: 2px solid #4a9d6f;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
            font-size: 16px;
            line-height: 1.8;
            color: #e0e0e0;
        }

        .financial-box strong {
            color: #6ab986;
            font-size: 18px;
        }

            border-collapse: collapse;
